name: Prospecting Actor canary

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 1"

permissions:
  contents: read

jobs:
  actor-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [google_maps, google_search, linkedin_profiles, website_enrichment]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise pinned Actor contract
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: >-
          node scripts/prospecting-actor-lab.mjs
          --source=${{ matrix.source }}
          --query=accountant
          --location=Sydney,Australia
          --max-items=3
          --timeout-seconds=120
          --confirm-spend
