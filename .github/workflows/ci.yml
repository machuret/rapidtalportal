name: CI

# Runs the type-checker, linter, and test suite on every push and PR so a
# broken type, lint error, or failing security test is caught before it reaches
# main — previously nothing gated pushes except a manual local check.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Styles guard
        run: pnpm run styles:check

      - name: Test with coverage ratchet
        run: pnpm run test:coverage

      # Full production build — catches what tsc/lint can't (bad imports in
      # server/client boundaries, config errors, route conflicts). Placeholder
      # env is enough: every page is force-dynamic, so nothing prerenders.
      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

  # The Supabase edge functions are Deno, so they're excluded from the Next
  # tsconfig/lint above and were previously checked by nothing — a typo shipped
  # straight to prod on `supabase functions deploy`. This type-checks them all.
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase edge functions
        working-directory: supabase/functions
        run: |
          deno check \
            company-dna-scrape/index.ts \
            content-generate/index.ts \
            kb-generate/index.ts \
            send-message/index.ts \
            vault-ask/index.ts \
            vault-delete/index.ts \
            vault-process/index.ts

      - name: Type-check live content evaluation
        run: |
          deno check supabase/functions/content-generate/live-golden-eval.ts
          deno check supabase/functions/content-generate/live-client-voice-eval.ts

      - name: Exercise Edge Function tenant boundaries
        working-directory: supabase/functions
        run: deno test content-generate/*.test.ts
