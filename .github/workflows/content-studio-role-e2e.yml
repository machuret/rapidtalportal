name: Content Studio signed-in role browser tests

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 20 * * 1-5"

jobs:
  role-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise super admin, client admin, VA, and tenant isolation
        run: pnpm run test:e2e:roles
        env:
          CI: "true"
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_CLIENT_ADMIN_EMAIL: ${{ secrets.E2E_CLIENT_ADMIN_EMAIL }}
          E2E_CLIENT_ADMIN_PASSWORD: ${{ secrets.E2E_CLIENT_ADMIN_PASSWORD }}
          E2E_VA_EMAIL: ${{ secrets.E2E_VA_EMAIL }}
          E2E_VA_PASSWORD: ${{ secrets.E2E_VA_PASSWORD }}
          E2E_CLIENT_ADMIN_CLIENT_ID: ${{ secrets.E2E_CLIENT_ADMIN_CLIENT_ID }}
          E2E_OTHER_CLIENT_ID: ${{ secrets.E2E_OTHER_CLIENT_ID }}
